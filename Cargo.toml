[package]
name = "local-pir-rpc"
version = "0.1.0"
edition = "2021"
description = "Standalone localhost Ethereum JSON-RPC: Helios-verified public reads, optional PIR"
publish = false

[[bin]]
name = "local-pir-rpc"
path = "src/main.rs"

[dependencies]
alloy = { version = "2.4.1", default-features = false, features = ["json-rpc"] }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
kohaku-privacy-rpc = { path = "vendor/kohaku-rs/privacy-rpc" }
kohaku-tor-rpc = { path = "vendor/kohaku-rs/tor-rpc" }
kohaku-pir-rpc = { path = "vendor/kohaku-rs/pir-rpc" }
pir-client = { path = "vendor/inspire/crates/client" }
pir-backend-ffi = { path = "vendor/inspire/crates/backend-ffi" }
pir-keyword = { path = "vendor/inspire/crates/keyword" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[patch.crates-io]
# Helios (git) does not compile against the crates.io ethereum_hashing release.
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
