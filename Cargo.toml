[package]
name = "local-pir-rpc"
version = "0.1.0"
edition = "2021"
description = "localhost:8545 JSON-RPC facade over kohaku-pir-provider for kohaku-cli demos"
publish = false

[[bin]]
name = "local-pir-rpc"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
kohaku-pir-provider = { path = "../kohaku-rs/crates/pir-provider" }
pir-client = { path = "../inspire-gpu-serving/crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
