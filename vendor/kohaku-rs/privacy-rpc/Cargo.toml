[package]
name = "kohaku-privacy-rpc"
version = "0.1.0"
edition = "2024"
description = "Batch-aware Tor + PIR privacy orchestrator for Alloy JSON-RPC"

[lib]
crate-type = ["rlib"]

[dependencies]
alloy = { workspace = true, features = [
    "rpc",
    "rpc-types",
    "json-rpc",
    "network",
    "providers",
    "transports",
    "sol-types",
] }
async-trait = { workspace = true }
axum = "0.8"
http-body-util = "0.1"
futures = { workspace = true }
helios-ethereum = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8", package = "helios-ethereum" }
hex = { workspace = true }
kohaku-pir-rpc = { workspace = true }
kohaku-tor-rpc = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tower = "0.5"
tracing = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
