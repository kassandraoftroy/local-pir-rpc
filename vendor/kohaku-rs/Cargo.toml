[workspace]
members = ["pir-rpc", "privacy-rpc", "tor-rpc"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
result_large_err = { level = "allow" }
cast_possible_truncation = { level = "allow" }

[workspace.dependencies]
alloy = "2.4.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3"
hex = "0.4.3"
kohaku-pir-rpc = { path = "pir-rpc" }
kohaku-tor-rpc = { path = "tor-rpc" }
reqwest = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"

[patch.crates-io]
# Helios (git) does not compile against the crates.io ethereum_hashing release.
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
